version: '3.8'

services:
  # ==============================================================================
  # PostgreSQL Database
  # ==============================================================================
  db:
    image: postgres:15-alpine
    container_name: lti_recommender_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lti_recommender_db}
      POSTGRES_USER: ${DB_USER:-lti_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lti_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lti_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lti_network

  # ==============================================================================
  # Redis Cache (Optional)
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: lti_recommender_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lti_network

  # ==============================================================================
  # Django Web Application
  # ==============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lti_recommender_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./keys:/app/keys
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    # Port 8000 only accessible internally via Nginx - not exposed publicly
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lti_network

  # ==============================================================================
  # Nginx Reverse Proxy
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: lti_recommender_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - lti_network

# ==============================================================================
# Networks
# ==============================================================================
networks:
  lti_network:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
